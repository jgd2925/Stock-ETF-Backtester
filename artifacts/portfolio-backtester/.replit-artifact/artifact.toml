kind = "web"
previewPath = "/"
title = "포트폴리오 백테스팅"
version = "1.0.0"
id = "artifacts/portfolio-backtester"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20621

[services.development]
run = "pnpm --filter @workspace/portfolio-backtester run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/portfolio-backtester", "run", "build" ]
publicDir = "artifacts/portfolio-backtester/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20621"
BASE_PATH = "/"
